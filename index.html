<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO & Description ──────────────────────────────────────────── -->
    <title>Kahani Events Training Hub</title>
    <meta
      name="description"
      content="Internal training platform for Kahani Events team members. Access courses, videos, and quizzes to grow your skills."
    />

    <!-- ── Security Meta Tags ─────────────────────────────────────────── -->
    <!-- Prevent this app from being framed (clickjacking protection) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Prevent MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Control referrer information sent to other sites -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- This is an internal app — do not index -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Google Fonts: Bona Nova SC (heading) + Inter (body) ──────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bona+Nova+SC:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/logo.png" />
    <script type="text/javascript" src="https://assets.mediadelivery.net/playerjs/playerjs-latest.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
